# tmux configuration for the dev container.
#
# Installed to ~/.tmux.conf by this feature (features/tmux/install.sh). Single
# owner on purpose: the settings below come from several different concerns, and
# the file is written whole, so it cannot be split across the features that
# motivate its individual lines without them clobbering each other.

# UTF-8 / 256-color support. Needed by the Pure prompt's symbols (features/pure-prompt),
# which otherwise render as mojibake inside tmux.
set -g default-terminal "tmux-256color"

# Extended keys (CSI u / modifyOtherKeys) so the pi coding agent (features/pi) reads
# modified keypresses correctly.
set -s extended-keys on
set -as terminal-features ',xterm-256color:extkeys'

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support
set -g mouse on

# Use Zsh as default shell inside tmux (installed by the common-utils feature).
set -g default-shell /bin/zsh
