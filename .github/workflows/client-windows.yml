name: Client Windows

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/Ghosts.Client.Windows/**'
      - 'src/Ghosts.Domain/**'
      - '.github/workflows/client-windows.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x32
            platform: AnyCPU
            output: bin/Release/
          - arch: x64
            platform: x64
            output: bin/x64/Release/
    steps:
      - uses: actions/checkout@v7

      # dotnet SDK needed to restore Ghosts.Domain (SDK-style, netstandard2.0)
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v3

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ matrix.arch }}-${{ hashFiles('src/Ghosts.Client.Windows/*.csproj', 'src/Ghosts.Domain/*.csproj') }}
          restore-keys: nuget-windows-${{ matrix.arch }}-

      - name: Build
        run: msbuild src/Ghosts.Client.Windows/Ghosts.Client.csproj /t:Rebuild /restore /nologo /v:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Package
        if: github.event_name == 'release'
        run: |
          Copy-Item -Recurse src/Ghosts.Client.Windows/${{ matrix.output }} ${{ matrix.arch }}
          Compress-Archive -Path ${{ matrix.arch }} -DestinationPath ghosts-client-windows-${{ matrix.arch }}.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ghosts-client-windows-${{ matrix.arch }}.zip
