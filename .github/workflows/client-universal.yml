name: Client Universal

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/Ghosts.Client.Universal/**'
      - 'src/Ghosts.Client.Universal.Tests/**'
      - 'src/Ghosts.Domain/**'
      - '.github/workflows/client-universal.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Test
        run: dotnet test src/Ghosts.Client.Universal.Tests/Ghosts.Client.Universal.Tests.csproj --configuration Release

  build:
    name: Build ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The csproj multi-targets net11.0 and net11.0-windows; publish needs -f
        include:
          - runtime: linux-x64
            framework: net11.0
          - runtime: linux-arm64
            framework: net11.0
          - runtime: win-x64
            framework: net11.0-windows
          - runtime: win-x86
            framework: net11.0-windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Publish
        run: |
          dotnet publish src/Ghosts.Client.Universal/Ghosts.Client.Universal.csproj \
            -c Release -f ${{ matrix.framework }} -r ${{ matrix.runtime }} --self-contained false \
            -o publish/${{ matrix.runtime }}

      - name: Package
        if: github.event_name == 'release'
        run: zip -r ghosts-client-universal-${{ matrix.runtime }}.zip publish/${{ matrix.runtime }}/

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ghosts-client-universal-${{ matrix.runtime }}.zip
