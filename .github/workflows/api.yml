name: API

on:
  push:
    paths:
      - 'src/Ghosts.Api/**'
      - 'src/Ghosts.Api.Tests/**'
      - 'src/Ghosts.Domain/**'
      - 'src/Ghosts.Animator/**'
      - 'src/Dockerfile-api'
      - '.github/workflows/api.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test src/Ghosts.Api.Tests/Ghosts.Api.Tests.csproj --configuration Release

  docker:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # GHCR secondary rate limits ask callers to wait a few minutes and retry
      - name: Wait out GHCR rate limit
        if: steps.push.outcome == 'failure'
        run: sleep 180

      - name: Build and push (retry)
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
