<div class="builder-shell">
  <div class="builder-header">
    <button mat-icon-button (click)="backToScenarios()" matTooltip="Back to Scenarios">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1>Scenario Builder</h1>
    @if (scenarioId()) {
    <span class="scenario-id">Scenario #{{ scenarioId() }}</span>
    }
  </div>

  @if (loading()) {
  <div class="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading scenario builder...</p>
  </div>
  }

  @if (!loading() && scenarioId()) {
  <mat-stepper [linear]="false" #stepper class="builder-stepper">
    <mat-step label="Sources">
      <app-builder-sources [scenarioId]="scenarioId()!"></app-builder-sources>
      <div class="stepper-actions">
        <button mat-button matStepperNext>Next: Conversation</button>
      </div>
    </mat-step>

    <mat-step label="Conversation">
      <app-builder-conversation [scenarioId]="scenarioId()!"></app-builder-conversation>
    </mat-step>
  </mat-stepper>
  }

</div>
