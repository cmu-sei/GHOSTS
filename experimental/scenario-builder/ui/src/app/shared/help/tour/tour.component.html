@if (stop(); as s) {
  <div class="scrim" aria-hidden="true">
    @if (spot(); as b) {
      <div class="spot" [style.top.px]="b.top" [style.left.px]="b.left" [style.width.px]="b.width" [style.height.px]="b.height"></div>
    }
  </div>
  <div #card class="card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-body" cdkTrapFocus
    [class.placed]="!!at()" [style.top.px]="at()?.top ?? 0" [style.left.px]="at()?.left ?? 0">
    <div class="card-top">
      <span class="count">{{ help.tourStep()! + 1 }} of {{ stops.length }}</span>
      <span class="pips" aria-hidden="true">
        @for (p of stops; track p.target; let i = $index) {
          <span class="pip" [class.on]="i <= help.tourStep()!"></span>
        }
      </span>
    </div>
    <h2 class="title" id="tour-title">{{ s.title }}</h2>
    <p class="text" id="tour-body">{{ s.body }}</p>
    <div class="actions">
      <button type="button" class="leave" (click)="help.endTour()">Leave the tour</button>
      <span class="spacer"></span>
      @if (help.tourStep()! > 0) {
        <button type="button" class="sb-button ghost" (click)="back()">Back</button>
      }
      <button #nextButton type="button" class="sb-button primary" (click)="forward()">{{ help.tourStep() === stops.length - 1 ? 'Done' : 'Next' }}</button>
    </div>
  </div>
} @else if (offer()) {
  <aside class="offer" aria-label="Tour">
    <span class="offer-mark" aria-hidden="true">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" /><path d="M8.2 7.6a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.6M10 13.6v.2" /></svg>
    </span>
    <div class="offer-text">
      <span class="offer-title">New to the builder?</span>
      <span class="offer-sub">A 60-second tour of where everything is.</span>
      <div class="offer-actions">
        <button type="button" class="sb-button primary" (click)="take()">Take the tour</button>
        <button type="button" class="sb-button ghost" (click)="decline()">Not now</button>
      </div>
    </div>
  </aside>
}
