; supervisord config for the dev container's long-running services.
; Static file, committed to the repo; start.sh points supervisord at it and
; supplies the few values that vary per container via the environment (expanded
; below as %(ENV_*)s): HOME, SUPERVISORD_DIR (this directory), WORKSPACE_DIR (the
; workspace/postStart cwd, for Open Terminal's --cwd) and LOGO_NAME (for Open
; WebUI's sidebar branding). See AGENTS.md "Process supervisor (supervisord)".
;
; The stack's loopback ports — 6090 (control, below) and 7000 Open WebUI / 7010 LiteLLM /
; 7020 SearXNG / 7030 Open Terminal (in bin/*.sh) — are also listed in this feature's
; devcontainer-feature.json under customizations.vscode.settings["remote.portsAttributes"],
; which is what labels them in VS Code's Ports view and keeps the internal ones from
; popping an auto-forward notification. Change a port in one place, change it in both.

[supervisord]
; nodaemon=false: supervisord forks and reparents to PID 1 — the mechanism that
; survives the rebuild teardown race (start.sh blocks on :6090 until it is up).
nodaemon=false
logfile=%(ENV_HOME)s/.data/supervisor/supervisord.log
pidfile=%(ENV_HOME)s/.data/supervisor/supervisord.pid
childlogdir=%(ENV_HOME)s/.data/supervisor
; Forwarded to every managed program (their wrappers read $WORKSPACE_DIR / $LOGO_NAME).
environment=WORKSPACE_DIR="%(ENV_WORKSPACE_DIR)s",LOGO_NAME="%(ENV_LOGO_NAME)s"

[inet_http_server]
; Bind 127.0.0.1 only with NO username/password — loopback binding is the access
; control, the same convention as the services it manages. Do NOT bind 0.0.0.0.
port=127.0.0.1:6090

[supervisorctl]
serverurl=http://127.0.0.1:6090

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; --- Managed services ---
; priority sets start ORDER: litellm (100) -> open-terminal + searxng (200) ->
; open-webui (300, last; its wrapper waits for the priority-200 deps' health,
; since priority orders starts but does not wait for health between them).
; Wrappers are invoked via `bash <path>` so they run regardless of the exec bit
; (which a Windows-host bind mount may not preserve). Logs go to the existing
; per-service paths with rotation (50MB x 10) instead of a single unbounded file.
;
; autostart=true: the services come up automatically whenever they are installed.
; Installation is the opt-in — a spawn omits the ./features/chat bundle (and this
; supervisord config with it) unless --chat was passed, so their mere presence means
; the user wants them running. start.sh gates its whole supervisord block on the
; supervisord binary existing, so a stripped stack never reaches this file.
; autorestart stays true so a crashed service recovers on its own.

[program:litellm]
command=/bin/bash %(ENV_SUPERVISORD_DIR)s/bin/litellm.sh
priority=100
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/.data/litellm/litellm.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true

[program:open-terminal]
command=/bin/bash %(ENV_SUPERVISORD_DIR)s/bin/open-terminal.sh
priority=200
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/.data/open-terminal/open-terminal.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true

[program:searxng]
command=/bin/bash %(ENV_SUPERVISORD_DIR)s/bin/searxng.sh
priority=200
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/.data/searxng/searxng.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true

[program:open-webui]
command=/bin/bash %(ENV_SUPERVISORD_DIR)s/bin/open-webui.sh
priority=300
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/.data/open-webui/open-webui.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
