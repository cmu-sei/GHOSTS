<app-top-bar [crumb]="store.name()">
  <nav class="pages" aria-label="Pages" data-tour="pages">
    @for (page of pages(); track page.path) {
      <a [routerLink]="page.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ page.label }}</a>
    }
  </nav>
</app-top-bar>

<div class="body" [class.no-rail]="!onQuestions()">
  @if (onQuestions()) {
    <aside class="rail" data-tour="rail">
      @if (store.scenarioType(); as scenarioType) {
        @if (store.progress(); as progress) {
          <app-stage-rail [scenarioType]="scenarioType" [progress]="progress" [selected]="store.selectedStage()" (select)="pick($event)" />
        }
      }
    </aside>
  }

  <main class="page">
    <app-scenario-type-update />
    @if (store.error(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }
    <router-outlet />
  </main>

  <aside class="agent" aria-label="Agent" data-tour="agent">
    @if (store.scenarioId()) {
      <app-agent-panel />
    }
  </aside>
</div>
